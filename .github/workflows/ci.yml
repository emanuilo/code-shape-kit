name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the PR's base branch, for the rules-loosened warning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the kit, its tools and pytest
        run: pip install -e ".[tools,dev]"
      - name: Tests
        run: pytest -q
      - name: The kit passes its own gates
        env:
          BASE_REF: ${{ github.base_ref }}
        run: code-shape check ${BASE_REF:+--base "origin/$BASE_REF" --summary "$GITHUB_STEP_SUMMARY"}
