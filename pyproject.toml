[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "code-shape-kit"
version = "0.1.1"
description = "Deterministic checks that keep a Python project's shape (structure, size, coupling) good"
readme = "README.md"
requires-python = ">=3.11"  # import-linter 2.17 and grimp 3.20 need 3.11+
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuilo Jovanovic" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "grimp>=3.20",                      # import graph (also used by import-linter)
]

[project.optional-dependencies]
# The tools the kit drives. Pinned exactly: a new tool version can add or change
# rules, and a gate must not start failing because CI installed something newer.
# Bump deliberately (and re-run `code-shape tighten` / `baseline` if numbers move).
tools = [
    "ruff==0.17.6",
    "complexipy==9.0.0",
    "pylint==4.1.4",
    "import-linter==2.17",
    "vulture==2.16",
    "deptry==0.25.1",
    "mypy==2.4.1",
]
dev = ["pytest>=9"]

[project.scripts]
code-shape = "code_shape.cli:main"

[project.urls]
Homepage = "https://github.com/emanuilo/code-shape-kit"

[tool.hatch.build.targets.wheel]
packages = ["code_shape"]

# ---------------------------------------------------------------------------
# The kit checks itself with its own defaults (dogfooding).
# ---------------------------------------------------------------------------
[tool.shape]
packages = ["code_shape"]
tests = "tests"
skip = ["deptry"]  # the kit's own runtime deps are tiny; tools are an extra on purpose
# The one place allowed to touch os.environ: it builds the environment for the tools it runs.
config_modules = ["code_shape/checks/linters.py"]

[tool.shape.concepts]
baseline = ["baseline", "ratchet"]
report = ["render", "markdown"]
git-history = ["git log", "commits\\("]

[tool.importlinter]
root_package = "code_shape"

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: entry point -> modes -> checks -> source files -> settings -> data model"
type = "layers"
containers = ["code_shape"]
layers = [
    "__main__",
    "cli",
    "report | baseline | trend",
    "checks",
    "source",
    "settings",
    "model",
]
exhaustive = true
broken_contract_guidance = "Lower layers must not import higher ones. Move shared code down (e.g. into model or source) instead."

[[tool.importlinter.contracts]]
id = "checks-independent"
name = "Check modules don't import each other (history is the one shared helper)"
type = "independence"
modules = [
    "code_shape.checks.sizes",
    "code_shape.checks.graph",
    "code_shape.checks.linters",
    "code_shape.checks.tests_mirror",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Normal lint for the kit's own code (separate from the shape checks).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
