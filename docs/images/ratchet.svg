<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-labelledby="title desc">
  <title id="title">The ratchet</title>
  <desc id="desc">A step line of known problems over time. It starts at the baseline and only steps down, each time code-shape tighten records an improvement. An attempt to go back up is blocked: the check fails.</desc>
  <style>
    .axis { stroke: #8b949e; stroke-width: 1.5; fill: none; }
    .grid { stroke: #8b949e; stroke-width: 1; stroke-dasharray: 2 5; opacity: .5; }
    .line { stroke: #2f81f7; stroke-width: 4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #2f81f7; }
    .up { stroke: #e5534b; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; }
    .stop { fill: #e5534b; }
    .stopmark { stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #57606a; }
    .strong { fill: #24292f; font-weight: 600; }
    .bad { fill: #d1242f; font-weight: 600; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #9198a1; }
      .strong { fill: #e6edf3; }
      .bad { fill: #ff7b72; }
    }
  </style>

  <!-- axes -->
  <path class="axis" d="M70 30 V200 H650"/>
  <text x="20" y="120" transform="rotate(-90 20 120)" text-anchor="middle">known problems</text>
  <text x="650" y="225" text-anchor="end">pull requests over time</text>
  <line class="grid" x1="70" y1="60" x2="650" y2="60"/>

  <!-- the ratchet: only steps down -->
  <path class="line" d="M70 60 H200 V100 H340 V140 H480 V170 H640"/>
  <circle class="dot" cx="70" cy="60" r="5"/>
  <text class="strong" x="80" y="48">baseline: the problems you have today</text>

  <text class="small" x="208" y="86">tighten</text>
  <text class="small" x="348" y="126">tighten</text>
  <text class="small" x="488" y="158">tighten</text>

  <!-- an attempt to go back up -->
  <path class="up" d="M410 140 V84"/>
  <circle class="stop" cx="410" cy="78" r="11"/>
  <path class="stopmark" d="M405 73 L415 83 M415 73 L405 83"/>
  <text class="bad" x="428" y="76">new or worse: check fails</text>
  <text class="small" x="428" y="94">a fixed problem can't come back</text>
</svg>
